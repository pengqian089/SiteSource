<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>图片点击事件调试</title>
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <link rel="stylesheet" href="core/css/version_2_0/article_list_version_2_0.css">
    <style>
        body {
            padding: 2rem;
            background: #f0f0f0;
        }
        
        .debug-info {
            background: #fff;
            padding: 1rem;
            margin-bottom: 1rem;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }
        
        .debug-log {
            background: #f8f9fa;
            border: 1px solid #dee2e6;
            border-radius: 4px;
            padding: 0.5rem;
            margin-top: 1rem;
            font-family: monospace;
            white-space: pre-wrap;
            max-height: 200px;
            overflow-y: auto;
        }
    </style>
</head>
<body>
    <div class="debug-info">
        <h2>图片点击事件调试</h2>
        <p>点击下面的图片，查看调试信息：</p>
        <div id="debug-log" class="debug-log">等待点击事件...</div>
    </div>

    <!-- 测试文章卡片 -->
    <article class="article shadow layui-anim layui-anim-upbit">
        <div class="article-content">
            <div class="article-left">
                <img src="https://picsum.photos/140/100?random=1" alt="测试图片" />
            </div>
            <div class="article-right">
                <h2 class="article-title">
                    <a href="#">测试文章标题</a>
                </h2>
                <div class="article-abstract">
                    这是一个测试文章的摘要内容，用于调试图片点击事件。
                </div>
            </div>
        </div>
        <div class="article-footer">
            <span><i class="layui-icon layui-icon-time"></i><span class="timeago">2024-01-15</span></span>
            <span><i class="layui-icon layui-icon-user"></i><span class="article-author">测试作者</span></span>
            <span><i class="layui-icon layui-icon-tag"></i>
                <div class="article-categories">
                    <a href="#" class="article-category-tag">测试分类</a>
                    <a href="#" class="article-category-tag">调试</a>
                </div>
            </span>
            <span><i class="layui-icon layui-icon-eye"></i><span class="article-view">123</span></span>
        </div>
    </article>

    <script>
        $(document).ready(function() {
            const log = document.getElementById('debug-log');
            
            function addLog(message) {
                const timestamp = new Date().toLocaleTimeString();
                log.textContent += `[${timestamp}] ${message}\n`;
                log.scrollTop = log.scrollHeight;
            }
            
            // 测试选择器
            const selector1 = ".article-content>.article-left img";
            const selector2 = ".article.shadow .article-left img";
            const selector3 = ".article .article-left img";
            
            addLog(`选择器1 "${selector1}" 匹配到 ${$(selector1).length} 个元素`);
            addLog(`选择器2 "${selector2}" 匹配到 ${$(selector2).length} 个元素`);
            addLog(`选择器3 "${selector3}" 匹配到 ${$(selector3).length} 个元素`);
            
            // 检查图片的CSS属性
            const $img = $(selector1).first();
            if ($img.length) {
                addLog(`图片的 pointer-events: ${$img.css('pointer-events')}`);
                addLog(`图片的 cursor: ${$img.css('cursor')}`);
                addLog(`图片的 z-index: ${$img.css('z-index')}`);
                addLog(`图片的 position: ${$img.css('position')}`);
            }
            
            // 注册点击事件（方式1：delegate）
            $(document).delegate(selector1, "click", function(e) {
                addLog(`✓ delegate方式：图片被点击了！src=${this.src}`);
                addLog(`事件目标：${e.target.tagName}, 当前元素：${e.currentTarget.tagName}`);
            });
            
            // 注册点击事件（方式2：on）
            $(document).on("click", selector1, function(e) {
                addLog(`✓ on方式：图片被点击了！src=${this.src}`);
            });
            
            // 注册点击事件（方式3：直接绑定）
            $(selector1).on("click", function(e) {
                addLog(`✓ 直接绑定：图片被点击了！src=${this.src}`);
            });
            
            // 检查是否有其他元素覆盖
            $(selector1).on("mouseenter", function() {
                addLog(`鼠标进入图片区域`);
                
                // 检查鼠标位置的元素
                $(this).on("mousemove.debug", function(e) {
                    const elementAtPoint = document.elementFromPoint(e.clientX, e.clientY);
                    if (elementAtPoint !== this) {
                        addLog(`⚠️ 警告：鼠标位置的元素不是图片，而是：${elementAtPoint.tagName}.${elementAtPoint.className}`);
                    }
                });
            });
            
            $(selector1).on("mouseleave", function() {
                addLog(`鼠标离开图片区域`);
                $(this).off("mousemove.debug");
            });
            
            // 全局点击监听
            $(document).on("click", function(e) {
                addLog(`全局点击：${e.target.tagName}.${e.target.className}`);
            });
            
            addLog(`调试初始化完成，jQuery版本：${$.fn.jquery}`);
        });
    </script>
</body>
</html>
